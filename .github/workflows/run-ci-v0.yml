name: Continuous integration (v0.x)

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha spec path(s) to run instead of the full suite"
        required: false
        default: ""

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x, 26.x]
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build project
        run: npm run build
      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx mocha --timeout 30000 ${{ inputs.test-filter }}
          else
            npm run test
          fi
      - name: Pin npm used by upstream publish
        if: matrix.node-version == '26.x'
        run: npm install -g npm@11.15.0
      - name: Pack package
        if: matrix.node-version == '26.x'
        run: npm pack
      - name: Upload package tarball
        if: matrix.node-version == '26.x'
        uses: actions/upload-artifact@v4
        with:
          name: axios-tgz
          path: axios-*.tgz
          if-no-files-found: error
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        if: matrix.node-version == '26.x' && github.event_name == 'pull_request'
